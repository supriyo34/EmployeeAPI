name: Build Employee API

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install .NET 10 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore NuGet packages
      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI/EmployeeAPI.csproj

      # Step 4: Build the application
      - name: Build Project
        run: dotnet build EmployeeAPI/EmployeeAPI.csproj --configuration Release --no-restore

      # Step 5: Publish the application
      - name: Publish Project
        run: dotnet publish EmployeeAPI/EmployeeAPI.csproj --configuration Release --no-build --output ./publish

      # Step 6: Verify publish folder exists
      - name: Verify Publish Output
        run: ls -R ./publish

      # Step 7: Upload the published files as an artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeAPI-Publish
          path: ./publish
          if-no-files-found: error
          retention-days: 7