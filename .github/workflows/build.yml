name: Build Employee API

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install .NET 10 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet packages
      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI/EmployeeAPI.csproj

      # Build the project
      - name: Build Project
        run: dotnet build EmployeeAPI/EmployeeAPI.csproj --configuration Release --no-restore

      # Publish the project
      - name: Publish Project
        run: dotnet publish EmployeeAPI/EmployeeAPI.csproj --configuration Release --no-build --output ./publish

      # Verify publish output
      - name: Verify Publish Output
        run: |
          echo "Published Files:"
          ls -R ./publish

      # Upload published files as an artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeAPI-Publish
          path: ./publish
          if-no-files-found: error
          retention-days: 7