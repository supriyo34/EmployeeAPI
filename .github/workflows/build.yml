name: Build Employee API

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI.slnx

      - name: Build Solution
        run: dotnet build EmployeeAPI.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test EmployeeAPI.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Project
        run: dotnet publish EmployeeAPI/EmployeeAPI.csproj --configuration Release --no-build --output ./publish

      - name: Verify Publish Output
        run: |
          echo "Published Files:"
          ls -R ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeAPI-Publish
          path: ./publish
          if-no-files-found: error
          retention-days: 7