name: Build Employee API

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:

  # -----------------------------
  # Job 1 - Build
  # -----------------------------
  build:
    name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI.slnx

      - name: Build Solution
        run: dotnet build EmployeeAPI.slnx --configuration Release --no-restore

      - name: Upload Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-code
          path: .
          retention-days: 1

  # -----------------------------
  # Job 2 - Test
  # -----------------------------
  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Source Artifact
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI.slnx

      - name: Run Unit Tests
        run: dotnet test EmployeeAPI.slnx --configuration Release --no-build --verbosity normal

  # -----------------------------
  # Job 3 - Publish
  # -----------------------------
  publish:
    name: Publish Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download Source Artifact
        uses: actions/download-artifact@v4
        with:
          name: source-code

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore EmployeeAPI.slnx

      - name: Publish Project
        run: dotnet publish EmployeeAPI/EmployeeAPI.csproj --configuration Release --output ./publish

      - name: Verify Publish Output
        run: |
          echo "Published Files:"
          ls -R ./publish

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeAPI-Publish
          path: ./publish
          if-no-files-found: error
          retention-days: 7

  # -----------------------------
  # Job 4 - Docker Build
  # -----------------------------
  docker:
  name: Build & Push Docker Image
  needs: publish
  runs-on: ubuntu-latest

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build \
          -t sdhar2/employeeapi:latest \
          -f EmployeeAPI/Dockerfile \
          EmployeeAPI

    - name: Push Docker Image
      run: |
        docker push sdhar2/employeeapi:latest